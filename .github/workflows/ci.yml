name: TixPulse CI - Quality Gate

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
  push:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality-and-security:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/core-api/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Code Formatting & Lint Check
        run: npm run lint

      - name: Type Checking (TypeScript)
        run: npx tsc --noEmit

      - name: Security & Vulnerability Audit
        run: |
          echo "Running dependency vulnerability scan..."
          npm audit --audit-level=critical || echo "Review minor advisories"

  automated-testing-and-build:
    name: Automated Testing & Build Validation
    needs: code-quality-and-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secretpassword
          POSTGRES_DB: tixpulse_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: services/core-api/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Sync Database Schema (Prisma)
        env:
          DATABASE_URL: postgresql://admin:secretpassword@localhost:5432/tixpulse_test_db?schema=public
        run: |
          npx prisma generate
          npx prisma db push

      - name: Run Automated Tests (Unit & E2E)
        env:
          DATABASE_URL: postgresql://admin:secretpassword@localhost:5432/tixpulse_test_db?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: npm test

      - name: Build Application Artifacts
        run: npm run build

      - name: Validate Dockerfile Build
        working-directory: services/core-api
        run: docker build -t tixpulse-core-api:ci-test .
